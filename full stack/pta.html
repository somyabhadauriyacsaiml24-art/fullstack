<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .container{
            
            outline: 2px solid black;
            display: flex;
            flex-direction: row;
            justify-content: space-evenly;
            align-items: center;
        }
        .container>div{
            background-color: black;
            color: white;
            width: 100px;
            flex-basis: 100px;
            height: 100px;
            align-content: center;
            text-align: center;
            }
            #box1{
                background-color: greenyellow;
                flex-grow: 2;
            }
            #bo2{
                flex-grow: 1;
            }
            #box3{
                background-color: blue;
                flex-grow: 1;
            }
            #box4{
                background-color:yellow;
                flex: 2 0 150px;
            }
            #box5{
                background-color:orange;
                flex: 1 0 150px;
            }
            #box6{
                background-color:red;
                flex: 1 0 150px;
            }
    </style>
</head>
<body>
    <div class="container">
        <div id = "box1">1</div>
        <div id = "box2"> 2</div>
        <div id = "box3">3</div>
        <div id = "box4">4</div>
        <div id = "box5"> 5</div>
        <div id = "box6">6</div>
    </div>
    
</body>
</html>
